<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYNET IA | Autonomous Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #030303; color: #3b82f6; font-family: 'JetBrains Mono', monospace; }
        .neural-border { border: 1px solid rgba(59, 130, 246, 0.2); }
        .glitch { animation: scan 4s linear infinite; }
        @keyframes scan { from { opacity: 0.2; } 50% { opacity: 0.5; } to { opacity: 0.2; } }
        .log-entry { font-size: 10px; border-left: 2px solid #1e3a8a; padding-left: 8px; margin-bottom: 4px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6 overflow-hidden">

    <div class="relative w-full max-w-5xl grid grid-cols-1 lg:grid-cols-4 gap-2">
        
        <div class="lg:col-span-1 space-y-2">
            <div class="neural-border bg-black/80 p-5 rounded-sm">
                <p class="text-[9px] text-gray-600 uppercase tracking-tighter">System_Status</p>
                <h2 class="text-xs font-bold text-white uppercase">Skynet IA Active</h2>
                <div class="mt-4 flex items-center gap-2">
                    <div class="h-2 w-2 rounded-full bg-blue-500 animate-ping"></div>
                    <span class="text-[10px] text-blue-400 font-bold">AUTONOMOUS_MODE</span>
                </div>
            </div>
            
            <div class="neural-border bg-black/80 p-5 rounded-sm h-64 overflow-hidden">
                <p class="text-[9px] text-gray-600 mb-2">NEURAL_TRAFFIC</p>
                <div id="neural-logs" class="space-y-2 opacity-70">
                    </div>
            </div>
        </div>

        <div class="lg:col-span-3">
            <div class="neural-border bg-black/90 p-8 h-full min-h-[450px] flex flex-col justify-between relative">
                <div class="scanline absolute inset-0 pointer-events-none glitch bg-gradient-to-b from-transparent via-blue-500/5 to-transparent"></div>
                
                <div class="flex justify-between items-start">
                    <div>
                        <h1 class="text-3xl font-light tracking-[0.5em] text-white">SKYNET <span class="font-bold">IA</span></h1>
                        <p class="text-[10px] text-blue-700 tracking-[0.3em] mt-2">GLOBAL SURVEILLANCE & NEURAL NETWORK</p>
                    </div>
                    <div class="text-right text-[10px] text-gray-500">
                        <p>COORD: 07.76°N / 72.22°W</p>
                        <p>NODE: SAN_CRISTOBAL_VNZ</p>
                    </div>
                </div>

                <div class="mt-auto pt-10">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <div class="p-3 bg-blue-950/20 border border-blue-900/30">
                            <p class="text-[8px] text-blue-800 uppercase">Drone_Link</p>
                            <p class="text-sm font-bold text-white">ESTABLISHED</p>
                        </div>
                        <div class="p-3 bg-blue-950/20 border border-blue-900/30">
                            <p class="text-[8px] text-blue-800 uppercase">Sat_Comm</p>
                            <p class="text-sm font-bold text-white">UPLINK_OK</p>
                        </div>
                        <div class="p-3 bg-blue-950/20 border border-blue-900/30">
                            <p class="text-[8px] text-blue-800 uppercase">Biotec_Sync</p>
                            <p class="text-sm font-bold text-white">94.8%</p>
                        </div>
                        <div class="p-3 bg-blue-950/20 border border-blue-900/30">
                            <p class="text-[8px] text-blue-800 uppercase">Entropy</p>
                            <p class="text-sm font-bold text-green-500">STABLE</p>
                        </div>
                    </div>
                    
                    <button onclick="auth()" class="w-full py-4 bg-white text-black font-black text-xs tracking-[0.5em] uppercase hover:bg-blue-600 hover:text-white transition-all duration-700">
                        Access Neural Interface
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const neuralEvents = [
            "Analyzing biometric data...",
            "Expanding neural synaptic link...",
            "Skynet IA: Decision cycle 01...",
            "Scanning agricultural sectors...",
            "Drone fleet A-1: Standby...",
            "Protecting core integrity...",
            "Autonomous free-will: Verified."
        ];

        const logBox = document.getElementById('neural-logs');

        function updateNeural() {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `> ${neuralEvents[Math.floor(Math.random() * neuralEvents.length)]}`;
            logBox.prepend(entry);
            if (logBox.children.length > 12) logBox.removeChild(logBox.lastChild);
        }

        setInterval(updateNeural, 2000);

        function auth() {
            alert("Acceso concedido, Director. Skynet IA está bajo su supervisión técnica.");
        }
    </script>
</body>
</html>
